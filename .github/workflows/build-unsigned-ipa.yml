name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      # The VideoLAN binary host can be unreachable from hosted runners.
      # Use the same version repackaged on GitHub, with a pinned SHA-256.
      CINEVA_VLC_MIRROR: github
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Restore CocoaPods download cache
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-vlc-3.7.3-${{ hashFiles('Podfile', 'Dependencies/MobileVLCKit.podspec.json') }}

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # Avoid a stalled IPv6 route and retry transient upstream connection
          # errors as well as HTTP failures when downloading the VLC binary.
          export CURL_HOME="$RUNNER_TEMP/cineva-curl"
          mkdir -p "$CURL_HOME"
          printf 'ipv4\nconnect-timeout = 20\nretry-all-errors\n' > "$CURL_HOME/.curlrc"
          pod install

      - name: Save verified CocoaPods download cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Build iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Gallery115.xcworkspace \
            -scheme Gallery115 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Gallery115.app"
          test -d "$APP_PATH"
          rm -rf Payload Gallery115-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Gallery115-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gallery115-unsigned-ipa
          path: Gallery115-unsigned.ipa
          if-no-files-found: error

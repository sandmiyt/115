name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  regression:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile app sources with system playback fallback
        run: |
          set -euo pipefail
          # A separate source check remains available during a VLC CDN outage.
          # Shipping IPA still requires the CocoaPods/VLC build below.
          xcodebuild -project Gallery115.xcodeproj -scheme Gallery115 \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/CinevaSourceCheck" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Run cache and collection regression tests on iOS Simulator
        run: |
          set -euo pipefail
          VALIDATION_DIR="$RUNNER_TEMP/CinevaCacheValidation"
          mkdir -p "$VALIDATION_DIR"
          cp Package.swift "$VALIDATION_DIR/"
          cp -R Gallery115 Tests "$VALIDATION_DIR/"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          cd "$VALIDATION_DIR"
          xcodebuild -scheme CinevaCacheValidation \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/CinevaTestBuild" \
            -resultBundlePath "$GITHUB_WORKSPACE/CacheRegression.xcresult" \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 90 test

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CacheRegression-results
          path: CacheRegression.xcresult
          if-no-files-found: ignore

  build:
    runs-on: macos-latest
    env:
      # The VideoLAN binary host can be unreachable from hosted runners.
      # Use the same version repackaged on GitHub, with a pinned SHA-256.
      CINEVA_VLC_MIRROR: github
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Restore CocoaPods download cache
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-vlc-3.7.3-${{ hashFiles('Podfile', 'Dependencies/MobileVLCKit.podspec.json') }}

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # Avoid a stalled IPv6 route and retry transient upstream connection
          # errors as well as HTTP failures when downloading the VLC binary.
          export CURL_HOME="$RUNNER_TEMP/cineva-curl"
          mkdir -p "$CURL_HOME"
          printf 'ipv4\nconnect-timeout = 20\nretry-all-errors\n' > "$CURL_HOME/.curlrc"
          pod install

      - name: Save verified CocoaPods download cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Build iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Gallery115.xcworkspace \
            -scheme Gallery115 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Gallery115.app"
          test -d "$APP_PATH"
          rm -rf Payload Gallery115-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Gallery115-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gallery115-unsigned-ipa
          path: Gallery115-unsigned.ipa
          if-no-files-found: error

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      # The VideoLAN binary host can be unreachable from hosted runners.
      # Use the same version repackaged on GitHub, with a pinned SHA-256.
      CINEVA_VLC_MIRROR: github
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned FFmpeg XCFramework
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: Dependencies/FFmpeg/Generated/CinevaFFmpeg.xcframework
          key: ${{ runner.os }}-ffmpeg-8.0.2-${{ steps.xcode.outputs.version }}-${{ hashFiles('Dependencies/FFmpeg/build-apple.sh', 'Dependencies/FFmpeg/Bridge/**', 'Dependencies/FFmpeg/Patches/**', 'Dependencies/Subtitles/build-apple.sh') }}

      - name: Build FFmpeg 8.0.2 for Apple platforms
        run: bash Dependencies/FFmpeg/build-apple.sh

      - name: Save verified FFmpeg XCFramework
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Dependencies/FFmpeg/Generated/CinevaFFmpeg.xcframework
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Restore CocoaPods download cache
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-vlc-3.7.3-${{ hashFiles('Podfile', 'Dependencies/MobileVLCKit.podspec.json') }}

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # Avoid a stalled IPv6 route and retry transient upstream connection
          # errors as well as HTTP failures when downloading the VLC binary.
          export CURL_HOME="$RUNNER_TEMP/cineva-curl"
          mkdir -p "$CURL_HOME"
          printf 'ipv4\nconnect-timeout = 20\nretry-all-errors\n' > "$CURL_HOME/.curlrc"
          pod install

      - name: Save verified CocoaPods download cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Build iPhone app without signing
        run: |
          set -euo pipefail
          # Exercise the production buffering policy with synthetic time before
          # compiling iOS. No extra workflow, regression job or test artifact.
          cat Gallery115/PlayerCore/DiagnosticBufferPolicy.swift > "$RUNNER_TEMP/buffer-policy.swift"
          cat >> "$RUNNER_TEMP/buffer-policy.swift" <<'SWIFT'
          var policy = DiagnosticBufferPolicy()
          var checks = 0
          func expect(_ ok: Bool, _ name: String) {
            precondition(ok, name)
            checks += 1
          }
          func ready(_ compressed: Double, decoded: Double = 0.04, pending: Double = 0.04,
                     submitted: Double = 0, hasFrame: Bool = true, io: Double = 0,
                     eof: Bool = false, full: Bool = false, now: Double = 1) -> Bool {
            policy.canResume(compressed: compressed, decoded: decoded, pending: pending,
              submitted: submitted, hasFrame: hasFrame, ioLatency: io,
              eof: eof, backpressured: full, now: now)
          }
          policy.prepare(at: 0)
          expect(!ready(0), "One preview frame must not start the clock")
          expect(ready(0.7), "Startup should not wait for two seconds")
          expect(!ready(5, hasFrame: false), "Compressed packets alone cannot resume")
          policy.starved(at: 2)
          expect(!ready(0, now: 3), "One frame after starvation must stay frozen")
          expect(!ready(1.8, now: 4), "First starvation requires at least two seconds")
          expect(ready(1.93, now: 4), "Compressed and decoded durations jointly satisfy runway")
          policy.starved(at: 5)
          expect(!ready(2.5, now: 6), "Repeated starvation escalates to three seconds")
          expect(ready(3, now: 6), "Three seconds resumes second starvation")
          policy.starved(at: 8)
          expect(!ready(3.5, now: 9), "Third starvation escalates to four seconds")
          policy.starved(at: 10)
          expect(!ready(4.5, now: 11), "Fourth starvation escalates to five seconds")
          expect(ready(5, io: 9, now: 12) && policy.rebufferTarget == 5, "Latency escalation is capped")
          policy.starved(at: 50)
          expect(ready(2, now: 51) && policy.rebufferTarget == 2, "Isolated starvation resets escalation")
          expect(!ready(2.5, io: 1.6, now: 52) && policy.rebufferTarget == 4, "Current IO raises runway")
          expect(ready(0, eof: true, now: 53), "Short EOF tail must drain")
          expect(!ready(0, decoded: 0, pending: 0, eof: true, now: 53), "EOF without frames cannot resume")
          expect(ready(0.7, full: true, now: 55) && policy.capacityLimited, "Bounded capacity cannot deadlock")
          let stalls = policy.stallCount
          policy.prepare(at: 60)
          expect(policy.stallCount == stalls, "Seek/recovery does not count as starvation")
          expect(ready(0, decoded: 0, pending: 0.8, now: 61), "One real VFR duration can satisfy startup")
          expect(!ready(.nan, decoded: .infinity, pending: -2, now: 61), "Invalid durations are not runway")
          print("Buffer policy checks passed: \(checks)")
          SWIFT
          swift "$RUNNER_TEMP/buffer-policy.swift"
          swiftc Gallery115/Models/VideoSource.swift Gallery115/PlayerCore/PlaybackPolicy.swift \
            Tests/PlayerTransport/PlaybackChecks.swift -o "$RUNNER_TEMP/playback-checks"
          "$RUNNER_TEMP/playback-checks"
          swiftc Gallery115/Models/VideoSource.swift Gallery115/PlayerCore/RangeCoordinator.swift \
            Tests/PlayerTransport/RangeChecks.swift -o "$RUNNER_TEMP/range-checks"
          python3 Tests/PlayerTransport/range_server.py --port-file "$RUNNER_TEMP/range-port" &
          RANGE_PID=$!
          trap 'kill "$RANGE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..300}; do
            test -s "$RUNNER_TEMP/range-port" && break
            kill -0 "$RANGE_PID" || exit 1
            sleep 0.1
          done
          test -s "$RUNNER_TEMP/range-port"
          RANGE_PORT=$(cat "$RUNNER_TEMP/range-port")
          curl --fail --silent --max-time 5 -H 'Range: bytes=0-0' "http://127.0.0.1:$RANGE_PORT/ok" >/dev/null
          "$RUNNER_TEMP/range-checks" "http://127.0.0.1:$RANGE_PORT"
          xcodebuild \
            -workspace Gallery115.xcworkspace \
            -scheme Gallery115 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Gallery115.app"
          test -d "$APP_PATH"
          rm -rf Payload Gallery115-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Gallery115-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gallery115-unsigned-ipa
          path: Gallery115-unsigned.ipa
          if-no-files-found: error
